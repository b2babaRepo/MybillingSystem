# Local PostgreSQL for development: docker compose up -d
# The API connects as khata_app, a normal (non-superuser) role that owns the database, so
# row-level security applies exactly as in production. Superusers would skip it.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
    ports:
      - "5434:5432"   # 5432 is often taken by a locally installed PostgreSQL; 5433 by SchoolErp
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grocery_khata"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
