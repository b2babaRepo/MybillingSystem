# Grocery Khata in production on a KVM 4 VPS (4 vCPU, 16 GB RAM), shared with other apps.
# Memory limits keep this stack to about 6 GB, so roughly 9 GB stays free for other apps and the system.
# The images are built on your PC or in CI and loaded here by deploy.sh; this file never builds anything.
# Start (or update) with: docker compose up -d
name: grocery-khata

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?set DB_ADMIN_PASSWORD in .env}
      APP_DB_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}
      TZ: Asia/Kolkata
    # Tuned for a 4 GB share of the server: a quarter for the shared cache, the rest left to the OS file cache.
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=100
      - -c
      - random_page_cost=1.1
      - -c
      - wal_compression=on
      - -c
      - log_min_duration_statement=1000
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grocery_khata"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    restart: unless-stopped
    mem_limit: 4g
    cpus: 2
    logging: &logs
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  api:
    image: grocery-khata-api:${TAG:-latest}
    env_file: .env
    environment:
      ConnectionStrings__Default: "Host=db;Database=grocery_khata;Username=khata_app;Password=${DB_APP_PASSWORD};Maximum Pool Size=40"
      # Each release brings its own database changes; deploy.sh takes a backup first.
      Database__MigrateOnStartup: "true"
      # The encryption keys for shops' WhatsApp tokens: kept across releases on the keys volume.
      DataProtection__KeysPath: /keys
      # Only the web container can reach the API (internal network), so the visitor address it forwards is trusted.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      TZ: Asia/Kolkata
    volumes:
      - api-keys:/keys
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 2
    logging: *logs

  web:
    image: grocery-khata-web:${TAG:-latest}
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      internal: {}
      # The shared proxy reaches the site by this name (proxy/sites/grocery-khata.caddy).
      edge:
        aliases: [grocery-khata-web]
    restart: unless-stopped
    mem_limit: 128m
    logging: *logs

  # A dump every night at 2:30 (India time), kept 14 nights in ./backups. Copy them off the server too.
  backup:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: ${DB_ADMIN_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Asia/Kolkata
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "/backup.sh", "loop"]
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped
    mem_limit: 256m
    logging: *logs

networks:
  # Database, API, website and backups: nothing here is reachable from the internet.
  internal: {}
  # Shared with the proxy (and other apps' websites). Made once by server-setup.sh.
  edge:
    external: true

volumes:
  db-data:
  api-keys:
