# The website's own server, behind the shared Caddy proxy (which does HTTPS). Serves the app and passes /api to the API.

# The visitor's real address comes from the proxy; only containers on the private Docker networks can reach us.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # Google Fonts (the Mukta typeface) is the one outside source; blob: is the voice note and photo previews;
    # Razorpay and Facebook (WhatsApp signup) only where those features are switched on.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://api.razorpay.com https://lumberjack.razorpay.com https://connect.facebook.net https://*.facebook.com; frame-ancestors 'none'; script-src 'self' https://checkout.razorpay.com https://connect.facebook.net; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com https://*.facebook.com" always;
    client_max_body_size 1m;

    location /api/ {
        # Photos and voice notes go up to 5.6 MB on a few endpoints; the API holds every other request to 1 MB itself.
        client_max_body_size 6m;
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Cache times by "expires", not add_header: an add_header here would drop the security headers above.
    location = /sw.js { expires -1; }
    location = /index.html { expires -1; }
    location /assets/ { expires 1y; }
    location / { try_files $uri /index.html; }
}
