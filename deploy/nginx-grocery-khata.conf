# /etc/nginx/sites-available/grocery-khata  (certificates by certbot --nginx)
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 443 ssl http2;
    server_name app.example.in;              # set the real domain
    root /opt/grocery-khata/web;             # frontend/dist

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # Google Fonts (the Mukta typeface) is the one outside source; blob: is the voice note and photo previews.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://api.razorpay.com https://lumberjack.razorpay.com https://connect.facebook.net https://*.facebook.com; frame-ancestors 'none'; script-src 'self' https://checkout.razorpay.com https://connect.facebook.net; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com https://*.facebook.com" always;
    client_max_body_size 1m;

    # AI order photos and voice notes are bigger than other requests (the API sets the same limits per endpoint).
    location ~ ^/api/v1/me/orders/(draft|transcribe)$ {
        client_max_body_size 3m;
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri /index.html; }
}
server { listen 80; server_name app.example.in; return 301 https://$host$request_uri; }
